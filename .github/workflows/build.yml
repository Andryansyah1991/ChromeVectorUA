      - name: Configure Android Gradle Plugin
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "8.6.1"

          candidates = [
              Path("build.gradle.kts"),
              Path("build.gradle")
          ]

          build_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if build_file is None:
              raise SystemExit("Root Gradle build file tidak ditemukan")

          text = build_file.read_text()
          lines = text.splitlines()
          found = False

          for i, line in enumerate(lines):
              if "com.android.application" not in line:
                  continue

              indent = re.match(r"\s*", line).group()
              apply_false = bool(
                  re.search(r"\bapply\s+false\b", line)
              )

              if build_file.suffix == ".kts":
                  replacement = (
                      indent +
                      'id("com.android.application") version "' +
                      version + '"'
                  )
              else:
                  replacement = (
                      indent +
                      "id 'com.android.application' version '" +
                      version + "'"
                  )

              if apply_false:
                  replacement += " apply false"

              lines[i] = replacement
              found = True

          if not found:
              raise SystemExit(
                  "Plugin com.android.application tidak ditemukan"
              )

          build_file.write_text("\n".join(lines) + "\n")

          print("Plugin berhasil diperbaiki:")
          print(build_file)
          print("\n".join(
              line for line in lines
              if "com.android.application" in line
          ))
          PY
