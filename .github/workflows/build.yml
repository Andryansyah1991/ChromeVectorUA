
name: Build ChromeVectorUA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract diagnostic project
        run: |
          test -f ChromeVectorUA_diagnostic_v1.1.zip
          unzip -oq ChromeVectorUA_diagnostic_v1.1.zip -d .
          echo "===== PROJECT STRUCTURE ====="
          ls -la
          test -f settings.gradle
          test -d app

      - name: Build APK
        run: gradle assembleDebug --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromeVectorUA-Diagnostic-v1.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
