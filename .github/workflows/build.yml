name: ChromeVectorUA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chromevectorua-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ChromeVectorUA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract v1.3 source
        run: |
          set -e
          mkdir -p source
          unzip -oq ChromeVectorUA_v1.3_source.zip -d source
          find source -maxdepth 4 -type f | sort

      - name: Detect Gradle project
        id: project
        shell: bash
        run: |
          set -e
          PROJECT=""

          while IFS= read -r -d '' SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/app/build.gradle.kts" ] || [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi

            if [ -f "$DIR/build.gradle.kts" ] || [ -f "$DIR/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find source \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project tidak ditemukan"
            exit 1
          fi

          echo "Project: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Configure Android Gradle Plugin
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "8.6.1"
          candidates = [
              Path("build.gradle.kts"),
              Path("build.gradle")
          ]

          build_file = next((p for p in candidates if p.is_file()), None)

          if build_file is None:
              raise SystemExit("Root build.gradle tidak ditemukan")

          text = build_file.read_text()

          pattern = r'id\s*\(\s*["\']com\.android\.application["\']\s*\)(?:\s+version\s+["\'][^"\']+["\'])?'

          if build_file.suffix == ".kts":
              replacement = 'id("com.android.application") version "8.6.1"'
          else:
              pattern = r'id\s+["\']com\.android\.application["\'](?:\s+version\s+["\'][^"\']+["\'])?'
              replacement = "id 'com.android.application' version '8.6.1'"

          updated, count = re.subn(pattern, replacement, text)

          if count == 0:
              raise SystemExit("Deklarasi plugin Android tidak ditemukan")

          build_file.write_text(updated)
          print("Plugin Android Gradle berhasil diperbaiki")
          print(build_file.read_text())
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          echo "apk_path=${{ steps.project.outputs.project_dir }}/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromeVectorUA-v1.3-debug
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
