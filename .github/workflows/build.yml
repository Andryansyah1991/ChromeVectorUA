name: ChromeVectorUA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chromevectorua-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f AndroidManifest.xml
          test -f ChromeVectorModule.java
          test -f module.prop
          test -f java_init.list
          test -f scope.list

          echo "Project files ditemukan"

      - name: Inspect Gradle configuration
        run: |
          echo "===== settings.gradle ====="
          cat settings.gradle

          echo "===== build.gradle ====="
          cat build.gradle

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Locate APK
        run: |
          find . -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromeVectorUA-v1.3-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
