name: ChromeVectorUA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chromevectorua-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR=$(dirname "$file")

            if [ -f "$DIR/app/build.gradle.kts" ] &&
               [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -name settings.gradle.kts -type f)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project tidak ditemukan"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Project ditemukan: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q 'Android 13' app/src/main/java/id/cocoeyon/chromevectorua/ChromeVectorModule.java
          grep -q 'Android 14' app/src/main/java/id/cocoeyon/chromevectorua/ChromeVectorModule.java
          grep -q 'Android 15' app/src/main/java/id/cocoeyon/chromevectorua/ChromeVectorModule.java
          grep -q 'Android 16' app/src/main/java/id/cocoeyon/chromevectorua/ChromeVectorModule.java
          grep -q 'Chrome/125.0.0.0' app/src/main/java/id/cocoeyon/chromevectorua/ChromeVectorModule.java

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromeVectorUA-v1.3-debug
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
