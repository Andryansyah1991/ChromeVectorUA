name: Build ChromeVectorUA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ChromeVectorUA_v1.3.1_source_fixed.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP source
        run: |
          test -f ChromeVectorUA_v1.3.1_source_fixed.zip

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q ChromeVectorUA_v1.3.1_source_fixed.zip -d source

          SETTINGS_FILE=$(find source -name settings.gradle.kts -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/ChromeVectorUA-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromeVectorUA-debug
          path: output/ChromeVectorUA-debug.apk
          if-no-files-found: error
          retention-days: 7
